# Baut Einsatz 112 für den Apple App Store und Google Play auf den Servern von Expo (EAS)
# und schickt die fertigen Builds auf Wunsch direkt an App Store Connect und die Play Console.
# Start von Hand: GitHub → Actions → „Store-Veröffentlichung“ → „Run workflow“.
#
# Benötigte Repository-Secrets (Anleitung: docs/STORES.md):
#   EXPO_TOKEN                   – Zugangstoken von expo.dev (für beide Stores)
#   ASC_API_KEY_P8               – Inhalt der .p8-Datei des App-Store-Connect-API-Schlüssels
#   ASC_KEY_ID, ASC_ISSUER_ID    – Schlüssel-ID und Issuer-ID dazu
#   APPLE_TEAM_ID                – Team-ID aus dem Apple-Developer-Konto
#   ASC_APP_ID                   – Apple-ID der App in App Store Connect (erst nach dem Anlegen der App)
#   GOOGLE_SERVICE_ACCOUNT_JSON  – Dienstkonto-Schlüssel für die Play Console (erst nach dem ersten Upload)
# Repository-Variablen für den Microsoft Store (aus Partner Center → Produktidentität):
#   MS_IDENTITY_NAME, MS_PUBLISHER, MS_PUBLISHER_DISPLAY_NAME
name: Store-Veröffentlichung

on:
  workflow_dispatch:
    inputs:
      plattform:
        description: Für welche Stores bauen?
        type: choice
        options: [alle, iphone, android, microsoft]
        default: alle
      hochladen:
        description: Fertige Builds an App Store Connect / Google Play senden (Microsoft Store immer von Hand)
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  android:
    if: inputs.plattform == 'alle' || inputs.plattform == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Secrets prüfen
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Das Secret EXPO_TOKEN fehlt. Anleitung: docs/STORES.md, Schritt 1"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Mit dem Expo-Projekt verknüpfen
        run: eas init --non-interactive --force

      - name: Android-App für Google Play bauen (.aab)
        run: |
          eas build --platform android --profile production --non-interactive --wait --json > build.json
          url=$(node -e "const b=require('./build.json');console.log([].concat(b)[0].artifacts.buildUrl)")
          curl -sSL "$url" -o Einsatz112-GooglePlay.aab
          ls -la Einsatz112-GooglePlay.aab

      - name: Datei zum Herunterladen bereitstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: store-android-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Google Play – Build ${{ github.run_number }}
          make_latest: false
          body: |
            **Einsatz112-GooglePlay.aab** ist die Datei für die Google Play Console.
            Beim allerersten Mal von Hand hochladen: Play Console → Einsatz 112 → *Test und Veröffentlichung* →
            *Geschlossener Test* → *Neuen Release erstellen* → Datei auswählen. Anleitung: docs/STORES.md
          files: Einsatz112-GooglePlay.aab

      - name: An Google Play senden (geschlossener Test, Entwurf)
        if: inputs.hochladen
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::notice::Kein GOOGLE_SERVICE_ACCOUNT_JSON hinterlegt – die .aab-Datei liegt im Release zum Hochladen von Hand."
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > google-service-account.json
          eas submit --platform android --profile production --latest --non-interactive

  ios:
    if: inputs.plattform == 'alle' || inputs.plattform == 'iphone'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
      EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      EXPO_APPLE_TEAM_TYPE: ${{ vars.APPLE_TEAM_TYPE || 'INDIVIDUAL' }}
      ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
    steps:
      - name: Secrets prüfen
        run: |
          missing=""
          for v in EXPO_TOKEN ASC_API_KEY_P8 EXPO_ASC_KEY_ID EXPO_ASC_ISSUER_ID EXPO_APPLE_TEAM_ID; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Es fehlen Secrets:$missing (EXPO_ASC_KEY_ID = ASC_KEY_ID, EXPO_ASC_ISSUER_ID = ASC_ISSUER_ID, EXPO_APPLE_TEAM_ID = APPLE_TEAM_ID). Anleitung: docs/STORES.md"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: |
          npm ci
          pip install pexpect

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Mit dem Expo-Projekt verknüpfen
        run: eas init --non-interactive --force

      - name: App-Store-Connect-Schlüssel bereitstellen
        run: |
          printf '%s\n' "$ASC_API_KEY_P8" | tr -d '\r' > asc-api-key.p8
          echo "EXPO_ASC_API_KEY_PATH=$PWD/asc-api-key.p8" >> "$GITHUB_ENV"

      # Beim ersten Lauf legt EAS hier Bundle-ID, Zertifikat und Provisioning-Profil bei Apple an.
      # Später prüft es nur, ob alles noch gültig ist.
      - name: Zertifikat und Profil einrichten
        run: python3 scripts/eas-auto-answer.py eas credentials:configure-build --platform ios --profile production

      - name: iPhone-App bauen
        run: eas build --platform ios --profile production --non-interactive --wait

      - name: An App Store Connect senden (TestFlight)
        if: inputs.hochladen
        run: |
          if [ -z "$ASC_APP_ID" ]; then
            echo "::notice::Noch kein ASC_APP_ID hinterlegt. Jetzt die App in App Store Connect anlegen (Bundle-ID io.github.tobiaslangde.einsatz112) und die Apple-ID der App als Secret ASC_APP_ID speichern – dann erneut starten. Anleitung: docs/STORES.md"
            exit 0
          fi
          node -e "
            const fs = require('fs');
            const j = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
            j.submit.production.ios = {
              ...j.submit.production.ios,
              ascAppId: process.env.ASC_APP_ID,
              appleTeamId: process.env.EXPO_APPLE_TEAM_ID,
              ascApiKeyPath: process.env.EXPO_ASC_API_KEY_PATH,
              ascApiKeyId: process.env.EXPO_ASC_KEY_ID,
              ascApiKeyIssuerId: process.env.EXPO_ASC_ISSUER_ID,
            };
            fs.writeFileSync('eas.json', JSON.stringify(j, null, 2));
          "
          eas submit --platform ios --profile production --latest --non-interactive

  microsoft:
    if: inputs.plattform == 'alle' || inputs.plattform == 'microsoft'
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      MS_IDENTITY_NAME: ${{ vars.MS_IDENTITY_NAME }}
      MS_PUBLISHER: ${{ vars.MS_PUBLISHER }}
      MS_PUBLISHER_DISPLAY_NAME: ${{ vars.MS_PUBLISHER_DISPLAY_NAME }}
    steps:
      - name: Variablen prüfen
        id: check
        shell: bash
        run: |
          if [ -z "$MS_IDENTITY_NAME" ] || [ -z "$MS_PUBLISHER" ] || [ -z "$MS_PUBLISHER_DISPLAY_NAME" ]; then
            echo "::notice::Microsoft Store übersprungen: Variablen MS_IDENTITY_NAME, MS_PUBLISHER und MS_PUBLISHER_DISPLAY_NAME fehlen. Anleitung: docs/STORES.md"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Abhängigkeiten installieren
        if: steps.check.outputs.skip != 'true'
        run: |
          npm ci
          npm ci --prefix desktop

      - name: Spiel für die Desktop-App bauen
        if: steps.check.outputs.skip != 'true'
        working-directory: desktop
        run: npm run prepare-app

      # Das Paket wird vom Microsoft Store selbst signiert – ein eigenes Zertifikat ist nicht nötig.
      - name: Paket für den Microsoft Store bauen (.appx)
        if: steps.check.outputs.skip != 'true'
        working-directory: desktop
        shell: bash
        run: |
          npx electron-builder --win appx --x64 --publish never \
            -c.appx.identityName="$MS_IDENTITY_NAME" \
            -c.appx.publisher="$MS_PUBLISHER" \
            -c.appx.publisherDisplayName="$MS_PUBLISHER_DISPLAY_NAME" \
            -c.extraMetadata.version=1.0.${{ github.run_number }} \
            -c.appx.applicationId=Einsatz112 \
            -c.appx.displayName="Einsatz 112" \
            -c.appx.languages=de-DE \
            -c.appx.artifactName=Einsatz112-MicrosoftStore.appx
          ls -la release

      - name: Datei zum Herunterladen bereitstellen
        if: steps.check.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: store-microsoft-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Microsoft Store – Build ${{ github.run_number }}
          make_latest: false
          body: |
            **Einsatz112-MicrosoftStore.appx** im Partner Center unter *Pakete* hochladen. Anleitung: docs/STORES.md
          files: desktop/release/Einsatz112-MicrosoftStore.appx
