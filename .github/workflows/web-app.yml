# Veröffentlicht Einsatz 112 als Web-App (für iPhone: in Safari „Zum Home-Bildschirm“).
# Die fertige Seite landet im Branch gh-pages, den GitHub Pages ausliefert:
# https://rettung.tankard.de (bzw. https://tobiaslangde-eng.github.io/rettung/)
#
# Einmalig nötig: Repository öffentlich, und unter Settings → Pages als Quelle
# „Deploy from a branch“ → Branch „gh-pages“ / „(root)“ wählen.
name: Web-App veröffentlichen

# Live geht nur, was in main liegt. Neue Funktionen entstehen in einem eigenen Branch und
# kommen erst per Pull Request (Merge) in main – und damit auf die Webseite.
# Der Arbeitsstand (claude/…-Branches) landet als Testversion unter https://rettung.tankard.de/vorschau/
# – mit eigenem Spielstand, die Live-Version bleibt unberührt.
#
# Zum Vergleichen lässt sich per Hand auch ein älterer Stand unter einer eigenen Vorschau-Adresse veröffentlichen:
# Actions → „Web-App veröffentlichen“ → Run workflow → bei „ref“ den Commit/Branch/Tag eintragen,
# bei „ordner“ z. B. vorschau/apple (→ https://rettung.tankard.de/vorschau/apple/).
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Älterer Stand für eine Vorschau (Commit, Branch oder Tag) – leer lassen für den aktuellen Stand'
        required: false
        default: ''
      ordner:
        description: 'Vorschau-Adresse, z. B. vorschau/apple – leer lassen für die normale Veröffentlichung'
        required: false
        default: ''

permissions:
  contents: write

# Beide Jobs schreiben in gh-pages: nacheinander ausführen, nichts abbrechen.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.ordner == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Web-App bauen
        run: npm run build:pwa

      # Eigene Adresse: nur eintragen, wenn der DNS-Eintrag (CNAME) wirklich auf GitHub zeigt –
      # sonst würde GitHub auf eine Adresse umleiten, die noch nicht funktioniert.
      - name: Eigene Adresse prüfen
        env:
          DOMAIN: rettung.tankard.de
        run: |
          ZIEL=$(dig +short CNAME "$DOMAIN" | head -n1)
          echo "CNAME von $DOMAIN: ${ZIEL:-(keiner)}"
          if [ "${ZIEL%.}" = "tobiaslangde-eng.github.io" ]; then
            echo "$DOMAIN" > dist-pwa/CNAME
            echo "✅ $DOMAIN wird als Adresse eingetragen"
          else
            echo "::warning::$DOMAIN zeigt noch nicht auf tobiaslangde-eng.github.io – Web-App bleibt unter github.io"
          fi

      - name: Nach gh-pages veröffentlichen
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist-pwa
          publish_branch: gh-pages
          keep_files: true # der Ordner vorschau/ bleibt erhalten
          commit_message: Web-App aus ${{ github.sha }}

  vorschau:
    # Arbeitsstände (alles außer main) – oder per Hand ein beliebiger Stand unter eigener Adresse
    if: github.ref != 'refs/heads/main' || inputs.ordner != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Vorschau bauen
        run: npm run build:pwa
        env:
          VORSCHAU: '1'

      - name: Nach gh-pages/vorschau veröffentlichen
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist-pwa
          publish_branch: gh-pages
          destination_dir: ${{ inputs.ordner || 'vorschau' }}
          keep_files: true # die Live-Version im Hauptordner bleibt erhalten
          commit_message: Vorschau ${{ inputs.ordner || 'vorschau' }} aus ${{ inputs.ref || github.sha }}
