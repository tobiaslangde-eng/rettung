# Veröffentlicht Kiirabi als Web-App (für iPhone: in Safari „Zum Home-Bildschirm“).
# Die fertige Seite landet im Branch gh-pages, den GitHub Pages ausliefert:
# https://tobiaslangde-eng.github.io/retung/
#
# Einmalig nötig: Repository öffentlich, und unter Settings → Pages als Quelle
# „Deploy from a branch“ → Branch „gh-pages“ / „(root)“ wählen.
name: Web-App veröffentlichen

on:
  push:
    branches: [main, claude/medical-game-app-expo-nru897]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-app
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Web-App bauen
        run: npm run build:pwa

      - name: Nach gh-pages veröffentlichen
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist-pwa
          publish_branch: gh-pages
          force_orphan: true
          commit_message: Web-App aus ${{ github.sha }}
