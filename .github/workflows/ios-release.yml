# Baut die iOS-App auf den Mac-Servern von Expo (EAS Build) und lädt sie
# zu App Store Connect / TestFlight hoch. Wird von Hand gestartet:
# GitHub → Actions → „iOS Release“ → „Run workflow“.
#
# Voraussetzungen (einmalig, siehe docs/APPLE-RELEASE.md):
#   - Repository-Secret EXPO_TOKEN (Zugangstoken von expo.dev)
#   - einmal lokal `npx eas-cli@latest build -p ios --profile production --auto-submit`
#     ausgeführt, damit Zertifikate und App-Store-Zugang bei Expo hinterlegt sind
name: iOS Release

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: ubuntu-latest
    steps:
      - name: EXPO_TOKEN prüfen
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Das Secret EXPO_TOKEN fehlt. Anleitung: docs/APPLE-RELEASE.md"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Mit dem Expo-Projekt verknüpfen
        run: eas init --non-interactive --force

      - name: iOS-Build starten und an TestFlight übergeben
        run: eas build --platform ios --profile production --non-interactive --auto-submit --no-wait
